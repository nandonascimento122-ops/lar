function valCPF(){
var v=document.getElementById('cpfIn').value.replace(/\D/g,'');
var out=document.getElementById('out');
if(v.length!=11){out.textContent='11 dígitos';return}
var s=0;for(var i=0;i<9;i++)s+=parseInt(v[i])*(10-i);
var d1=11-s%11;if(d1>9)d1=0;
s=0;for(var i=0;i<10;i++)s+=parseInt(v[i])*(11-i);
var d2=11-s%11;if(d2>9)d2=0;
out.innerHTML=(d1==v[9]&&d2==v[10]?'<span style=color:green>✅ CPF VÁLIDO</span>':'<span style=color:red>❌ CPF INVÁLIDO</span>')+' - '+v;
}
function genCPF(){
var n=[];for(var i=0;i<9;i++)n.push(Math.floor(Math.random()*9));
var s=0;for(var i=0;i<9;i++)s+=n[i]*(10-i);var d1=11-s%11;if(d1>9)d1=0;n.push(d1);
s=0;for(var i=0;i<10;i++)s+=n[i]*(11-i);var d2=11-s%11;if(d2>9)d2=0;n.push(d2);
document.getElementById('cpfIn').value=n.join('');valCPF();
}

var v=document.getElementById('urlIn').value;
var out=document.getElementById('out');
out.textContent='Encurtando...';
try{var r=await fetch('https://is.gd/create.php?format=json&url='+encodeURIComponent(v));var j=await r.json();out.textContent=j.shorturl||JSON.stringify(j);}catch(e){out.textContent='Erro'}
}
async function valHash(){
var v=document.getElementById('hashIn').value;
var out=document.getElementById('out');
var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
var arr=Array.from(new Uint8Array(buf));
var hex=arr.map(function(b){return b.toString(16).padStart(2,'0');}).join('');
out.textContent=hex;
}
function valJWT(){
var v=document.getElementById('jwtIn').value;
var out=document.getElementById('out');
try{var p=v.split('.');out.textContent='Header: '+atob(p[0])+'\nPayload: '+atob(p[1]);}catch(e){out.textContent='JWT inválido'}
}
function valRegex(){
var re=document.getElementById('reIn').value;
var txt=document.getElementById('txtIn').value;
var out=document.getElementById('out');
try{var r=new RegExp(re,'g');var m=txt.match(r);out.textContent=(m||[]).join('\n')||'Nenhum match';}catch(e){out.textContent='Erro regex'}
}
function genQR(){
var v=document.getElementById('qrIn').value;
var c=document.getElementById('c');
var ctx=c.getContext('2d');
ctx.fillStyle='white';ctx.fillRect(0,0,220,220);
ctx.fillStyle='black';ctx.fillRect(10,10,200,200);
ctx.fillStyle='white';ctx.fillRect(20,20,40,40);ctx.fillRect(120,20,40,40);ctx.fillRect(20,120,40,40);
document.getElementById('out').textContent='QR para: '+v;
}
function removeBG(){
var c=document.getElementById('c');
var ctx=c.getContext('2d');
var d=ctx.getImageData(0,0,c.width,c.height);
for(var i=0;i<d.data.length;i+=4){
if(d.data[i]>200&&d.data[i+1]>200&&d.data[i+2]>200){
d.data[i+3]=0;
}
}
ctx.putImageData(d,0,0);
}
function genPass(){
var chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#';
var s='';for(var i=0;i<16;i++)s+=chars[Math.floor(Math.random()*chars.length)];
document.getElementById('out').textContent=s;
}
function calcIMC(){
var p=parseFloat(document.getElementById('peso').value);
var a=parseFloat(document.getElementById('altura').value);
var imc=p/(a*a);
var cls=imc<18.5?'Abaixo':imc<25?'Normal':imc<30?'Sobrepeso':'Obesidade';
document.getElementById('out').textContent='IMC: '+imc.toFixed(2)+' - '+cls;
}
