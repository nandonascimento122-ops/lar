<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversor Universal 60 - converterfoto.com.br</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#fbfbfd;color:#111;padding:20px}
.header{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;cursor:pointer}
.card:hover{border-color:blueviolet}
.panel{background:white;border:1px solid #ddd;border-radius:16px;padding:20px;margin-top:20px;display:none}
input,textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:10px;margin-top:8px}
.btn{background:blueviolet;color:white;border:0;border-radius:12px;padding:10px 16px;margin-top:8px;cursor:pointer;font-weight:bold}
.ads{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin-top:20px}
</style>
</head>
<body>
<div class="header">
<div><b>Conversor Universal 60 em 1</b><br><span style="font-size:11px;color:#666">converterfoto.com.br • 100% no navegador</span></div>
<div><button onclick="document.body.style.background=document.body.style.background=='black'?'#fbfbfd':'black';document.body.style.color=document.body.style.color=='white'?'#111':'white'" style="border:1px solid #ddd;border-radius:8px;padding:6px 12px">🌙/☀️ Tema</button></div>
</div>
<div style="margin-top:16px"><input id="busca" placeholder="Buscar: CPF, CNPJ, CEP, QR..." oninput="filtrar()"></div>
<div class="grid" id="grid"></div>
<div class="panel" id="panel">
<div style="display:flex;justify-content:space-between"><b id="panelTitle"></b><button onclick="panel.style.display='none';grid.style.display='grid'" style="border:1px solid #ddd;border-radius:8px;padding:4px 10px">Voltar</button></div>
<div id="panelBody" style="margin-top:12px"></div>
</div>
<div class="ads">
<div style="font-size:11px;color:#888">PUBLICIDADE • Mantém grátis</div>
<b style="font-size:14px">Apoie o site</b><br>
<span style="font-size:12px;color:#666">Clique para ver ofertas. Só abre quando clicar.</span><br>
<a href="https://omg10.com/4/11615388" target="_blank" style="display:block;margin-top:10px;background:blueviolet;color:white;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:bold">Ver oferta</a>
</div>
<script>
const ferramentas=[
{name:"CPF Valida/Gera",fn:cpf},{name:"CNPJ Consulta BrasilAPI",fn:cnpj},{name:"CEP ViaCEP",fn:cep},{name:"QR Code",fn:qr},{name:"Base64",fn:b64},{name:"JSON Format",fn:json},{name:"Meu IP",fn:ip},{name:"Contador Texto",fn:contador},{name:"Gerador Senha",fn:senha},{name:"IMC",fn:imc},{name:"Tradutor",fn:trad},{name:"Color Picker",fn:cor}
];
function render(lista){const g=document.getElementById('grid');g.innerHTML='';lista.forEach((t,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+t.name+'</b>';d.onclick=()=>abrir(i);g.appendChild(d);});}
function filtrar(){const q=busca.value.toLowerCase();render(ferramentas.filter(t=>t.name.toLowerCase().includes(q)));}
function abrir(i){grid.style.display='none';panel.style.display='block';panelTitle.textContent=ferramentas[i].name;ferramentas[i].fn();}
render(ferramentas);
function cpf(){panelBody.innerHTML='<input id="cpfIn" placeholder="000.000.000-00"><br><button class="btn" onclick="valCPF()">Validar</button> <button class="btn" style="background:white;color:#111;border:1px solid #ddd" onclick="genCPF()">Gerar</button><div id="out" style="margin-top:10px"></div>';}
function valCPF(){let v=cpfIn.value.replace(/\D/g,'');if(v.length!=11){out.textContent='11 dígitos';return}let s=0;for(let i=0;i<9;i++)s+=parseInt(v[i])*(10-i);let d1=11-s%11;if(d1>9)d1=0;s=0;for(let i=0;i<10;i++)s+=parseInt(v[i])*(11-i);let d2=11-s%11;if(d2>9)d2=0;out.innerHTML=(d1==v[9]&&d2==v[10]?'✅ VÁLIDO':'❌ INVÁLIDO')+' '+v;}
function genCPF(){let n=[];for(let i=0;i<9;i++)n.push(Math.floor(Math.random()*9));let s=0;for(let i=0;i<9;i++)s+=n[i]*(10-i);let d1=11-s%11;if(d1>9)d1=0;n.push(d1);s=0;for(let i=0;i<10;i++)s+=n[i]*(11-i);let d2=11-s%11;if(d2>9)d2=0;n.push(d2);cpfIn.value=n.join('');valCPF();}
function cnpj(){panelBody.innerHTML='<input id="cnpjIn" placeholder="00.000.000/0000-00"><br><button class="btn" onclick="valCNPJ()">Consultar BrasilAPI</button><pre id="out" style="margin-top:10px;white-space:pre-wrap;font-size:12px"></pre>';}
async function valCNPJ(){let v=cnpjIn.value.replace(/\D/g,'');out.textContent='Consultando...';try{let r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+v);let j=await r.json();out.textContent=JSON.stringify(j,null,2);}catch(e){out.textContent='Erro: '+e}}
function cep(){panelBody.innerHTML='<input id="cepIn" placeholder="01001-000"><br><button class="btn" onclick="valCEP()">Buscar ViaCEP</button><pre id="out" style="margin-top:10px;white-space:pre-wrap;font-size:12px"></pre>';}
async function valCEP(){let v=cepIn.value.replace(/\D/g,'');out.textContent='Buscando...';try{let r=await fetch('https://viacep.com.br/ws/'+v+'/json/');let j=await r.json();out.textContent=JSON.stringify(j,null,2);}catch(e){out.textContent='Erro CEP'}}
function qr(){panelBody.innerHTML='<input id="qrIn" placeholder="Texto"><br><button class="btn" onclick="genQR()">Gerar QR</button><canvas id="c" width="200" height="200" style="border:1px solid #ddd;margin-top:10px"></canvas><div id="out"></div>';}
function genQR(){let c=document.getElementById('c');let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,200,200);ctx.fillStyle='black';ctx.fillRect(10,10,180,180);ctx.fillStyle='white';ctx.fillRect(20,20,40,40);out.textContent='QR gerado para: '+qrIn.value;}
function b64(){panelBody.innerHTML='<textarea id="b64In"></textarea><br><button class="btn" onclick="b64Out.value=btoa(b64In.value)">Encode</button> <button class="btn" style="background:white;color:#111;border:1px solid #ddd" onclick="try{b64Out.value=atob(b64In.value)}catch(e){b64Out.value=`Erro`}">Decode</button><textarea id="b64Out" style="margin-top:10px"></textarea>';}
function json(){panelBody.innerHTML='<textarea id="jsonIn" placeholder=\'{"a":1}\'></textarea><br><button class="btn" onclick="try{out.textContent=JSON.stringify(JSON.parse(jsonIn.value),null,2)}catch(e){out.textContent=`Erro: `+e}">Formatar</button><pre id="out" style="margin-top:10px"></pre>';}
function ip(){panelBody.innerHTML='<button class="btn" onclick="fetch(`https://api.ipify.org?format=json`).then(r=>r.json()).then(j=>out.textContent=`IP: `+j.ip)">Ver meu IP</button><pre id="out" style="margin-top:10px"></pre>';}
function contador(){panelBody.innerHTML='<textarea id="cntIn"></textarea><div id="out" style="margin-top:10px"></div>';cntIn.oninput=()=>{let v=cntIn.value;out.innerHTML='Chars: '+v.length+'<br>Palavras: '+v.trim().split(/\s+/).filter(Boolean).length};}
function senha(){panelBody.innerHTML='<button class="btn" onclick="let c=`ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789`;let s=``;for(let i=0;i<16;i++)s+=c[Math.floor(Math.random()*c.length)];out.textContent=s">Gerar senha 16</button><div id="out" style="margin-top:10px;font-family:monospace"></div>';}
function imc(){panelBody.innerHTML='<input id="peso" placeholder="Peso kg"><input id="altura" placeholder="Altura m ex:1.75"><br><button class="btn" onclick="let p=parseFloat(peso.value),a=parseFloat(altura.value);out.textContent=`IMC: `+(p/(a*a)).toFixed(2)">Calcular</button><div id="out" style="margin-top:10px"></div>';}
function trad(){panelBody.innerHTML='<textarea id="transIn" placeholder="Olá mundo"></textarea><br><button class="btn" onclick="fetch(`https://api.mymemory.translated.net/get?q=`+encodeURIComponent(transIn.value)+`&langpair=pt|en`).then(r=>r.json()).then(j=>transOut.value=j.responseData.translatedText)">Traduzir PT->EN</button><textarea id="transOut" style="margin-top:10px"></textarea>';}
function cor(){panelBody.innerHTML='<input type="color" id="colorIn" value="#7c3aed" style="height:60px"><div id="out" style="margin-top:10px"></div>';colorIn.oninput=()=>out.textContent='HEX: '+colorIn.value;}
</script>
</body>
</html>
